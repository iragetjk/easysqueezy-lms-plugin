# EasySqueezy's own DSD rules (need ffmpeg; MP3 also lame), added for a phone that has no usable
# DSD rule. Same as docs/server/custom-convert-easysqueezy.conf. Not a custom-convert.conf: the
# plugin reads it itself and adds the rules per phone.
dsf pcm easysqueezy *
	# FT:{START=-ss %s}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 44100 -f s16le -
dff pcm easysqueezy *
	# FT:{START=-ss %s}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 44100 -f s16le -
dsf mp3 easysqueezy *
	# FT:{START=-ss %s}B:{BITRATE=-B %B}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 44100 -f wav - | [lame] --silent -V 0 $BITRATE$ - -
dff mp3 easysqueezy *
	# FT:{START=-ss %s}B:{BITRATE=-B %B}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 44100 -f wav - | [lame] --silent -V 0 $BITRATE$ - -
