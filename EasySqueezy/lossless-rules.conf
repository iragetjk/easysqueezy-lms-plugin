# EasySqueezy's lossless format rules, added per phone for the format chosen in the app
# (Settings > Lossless format). The third column names the choice: "asis" (as it is) or
# "flac16" (FLAC 16-bit/44.1 kHz). "pcm" needs no rules (Lyrion's own). Not a
# custom-convert.conf: the plugin reads it itself and adds the rules for the phone only.

# --- As it is -------------------------------------------------------------------------------
# FLAC stays FLAC, losslessly re-encoded (fast setting) rather than passed through: after a
# seek Lyrion sends a passed-through FLAC without its header, which the phone can't start on.
# The audio is bit-identical. Other lossless formats come as FLAC by Lyrion's own rules.
flc flc asis *
	# IFT:{START=--skip=%t}U:{END=--until=%v}E:{NOSTART=I}
	[flac] -cs --totally-silent --compression-level-0 $START$ $END$ -- $FILE$

# DSD as FLAC 24-bit/88.2 kHz (needs ffmpeg).
dsf flc asis *
	# FT:{START=-ss %s}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 88200 -sample_fmt s32 -bits_per_raw_sample 24 -c:a flac -compression_level 0 -f flac -
dff flc asis *
	# FT:{START=-ss %s}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 88200 -sample_fmt s32 -bits_per_raw_sample 24 -c:a flac -compression_level 0 -f flac -

# --- FLAC 16-bit/44.1 kHz -------------------------------------------------------------------
# Every lossless format, decoded, resampled (sox, very high quality) and reduced to 16 bit
# (sox dithers), as FLAC.
flc flc flac16 *
	# IFT:{START=--skip=%t}U:{END=--until=%v}D
	[flac] -dcs --totally-silent $START$ $END$ -- $FILE$ | [sox] -q --ignore-length -t wav - -t flac -C 0 -b 16 - rate -v 44100
wav flc flac16 *
	# FT:{START=--skip=%t}U:{END=--until=%v}D
	[flac] -cs --totally-silent --compression-level-0 $START$ $END$ -- $FILE$ | [sox] -q -t flac - -t flac -C 0 -b 16 - rate -v 44100
aif flc flac16 *
	# FT:{START=--skip=%t}U:{END=--until=%v}D
	[flac] -cs --totally-silent --compression-level-0 $START$ $END$ -- $FILE$ | [sox] -q -t flac - -t flac -C 0 -b 16 - rate -v 44100
alc flc flac16 *
	# FT:{START=-j %s}U:{END=-e %u}D
	[faad] -q -w -f 1 $START$ $END$ $FILE$ | [sox] -q --ignore-length -t wav - -t flac -C 0 -b 16 - rate -v 44100
ape flc flac16 *
	# FD
	[mac] $FILE$ - -d | [sox] -q --ignore-length -t wav - -t flac -C 0 -b 16 - rate -v 44100
wvp flc flac16 *
	# FT:{START=--skip=%t}U:{END=--until=%v}D
	[wvunpack] $FILE$ -wq $START$ $END$ -o - | [sox] -q --ignore-length -t wav - -t flac -C 0 -b 16 - rate -v 44100
dsf flc flac16 *
	# FT:{START=-ss %s}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 44100 -sample_fmt s16 -c:a flac -compression_level 0 -f flac -
dff flc flac16 *
	# FT:{START=-ss %s}D
	[ffmpeg] -hide_banner -loglevel error $START$ -i $FILE$ -vn -ac 2 -ar 44100 -sample_fmt s16 -c:a flac -compression_level 0 -f flac -
